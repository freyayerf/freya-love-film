<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="上传剧照，制作自己的 2026 电影票根，批量导出 PNG 和 PDF。">
<title>FREYA LOVE FILM · 电影票根工作室</title>
<style>
:root{color-scheme:light;--page:#f7f4ed;--panel:#fffcf6;--ink:#2d2722;--muted:#74675d;--line:#e4dacf;--accent:#a13829;--accent-dark:#852d21;--soft:#f4e7df;--radius:13px;--sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--sans)}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.topbar{border-bottom:1px solid var(--line);background:#fcf9f2}
.top-inner,main{width:min(1320px,100%);margin:auto;padding-inline:clamp(16px,4vw,56px)}
.top-inner{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;background:var(--accent);color:#fff8ee;border-radius:10px;flex:none}
.brand-mark i{position:relative;display:block;width:19px;height:13px;border:1.5px solid currentColor;border-radius:2px;transform:rotate(-13deg)}
.brand-mark i:before,.brand-mark i:after{content:"";position:absolute;top:3px;width:4px;height:4px;border:1px solid currentColor;border-radius:100%;background:var(--accent)}
.brand-mark i:before{left:-4px}.brand-mark i:after{right:-4px}
.brand-mark b{position:absolute;left:9px;top:2px;height:7px;border-left:1px dashed currentColor}
.brand h1{font-size:17px;line-height:1.25;letter-spacing:.055em;margin:0 0 3px;font-weight:780}
.brand p{font:650 10px/1 var(--mono);letter-spacing:.155em;color:var(--accent);margin:0}
.exports{display:flex;align-items:center;gap:8px}
.button{min-height:35px;padding:6px 13px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:650;white-space:nowrap;display:inline-flex;justify-content:center;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.button:hover:not(:disabled){background:#f3ede3;border-color:#cfc0b3}
.button.primary{background:var(--accent);border-color:var(--accent);color:#fff9ef}
.button.primary:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.download-icon{display:inline-block;width:13px;height:11px;border:solid currentColor;border-width:0 1px 1px;border-radius:0 0 2px 2px;position:relative;margin-top:3px}
.download-icon:before{content:"";position:absolute;left:5px;top:-5px;height:9px;border-left:1px solid currentColor}
.download-icon:after{content:"";position:absolute;left:3px;top:0;width:4px;height:4px;border:solid currentColor;border-width:0 1px 1px 0;transform:rotate(45deg)}
main{padding-block:25px 24px}
.workspace{display:grid;grid-template-columns:minmax(0,1.34fr) minmax(345px,1fr);gap:18px}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;min-width:0}
.panel-head{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 19px;border-bottom:1px solid var(--line)}
h2{margin:0;font-size:15px;font-weight:760;letter-spacing:.04em}
.dimension,.counter,.format,.hex{font:11px/1.35 var(--mono);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.preview-panel{display:flex;flex-direction:column}
.preview-heading{display:flex;align-items:baseline;gap:11px}
.segment{display:flex;gap:2px;padding:3px;background:#f3ece2;border-radius:7px}
.segment button{font-size:11px;padding:4px 8px;border:0;color:var(--muted);border-radius:5px;background:transparent;white-space:nowrap}
.segment button[aria-pressed="true"]{color:var(--ink);background:var(--panel);box-shadow:0 1px 2px #4525101f}
.stage{flex:1;min-height:540px;display:grid;place-items:center;padding:18px 18px 17px;position:relative;isolation:isolate;background-color:#e9e0d3;background-image:radial-gradient(#9a887269 .65px,transparent .8px),radial-gradient(ellipse at 53% 43%,#fbf4e9 0%,#efe6da 47%,#e7dac9 100%);background-size:14px 14px,100% 100%}
.stage:before{content:"";position:absolute;inset:13px;border:1px solid #9c85623b;border-radius:4px;pointer-events:none;z-index:-1}
.ticket-wrap{position:relative;display:grid;place-items:center;filter:drop-shadow(1px 3px 3px #42261725) drop-shadow(8px 14px 16px #42261735)}
.ticket-wrap canvas{display:block;width:var(--ticket-width,235px);height:auto;max-width:100%;touch-action:pan-y}
.photo-drag{position:absolute;cursor:grab;touch-action:none;border-radius:4%;user-select:none}
.photo-drag.dragging{cursor:grabbing}
.stage-footer{display:flex;align-items:center;justify-content:center;min-height:33px;border-top:1px solid var(--line);background:#fbf7ef;color:var(--muted);font-size:11px;letter-spacing:.03em;text-align:center;padding:4px 8px}
.editor-head{min-height:58px}
.editor-body{padding:15px 19px 18px}
.section-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.section-top h3{font-size:12px;letter-spacing:.065em;font-weight:770;margin:0}
.project-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;padding:10px 14px}
.project-name{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.project-name label{white-space:nowrap;font-size:12px;font-weight:750}
.project-name input{min-width:0;width:min(100%,280px);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fffdf8;color:var(--ink)}
.project-actions{display:flex;gap:6px;flex-wrap:wrap}
.project-actions .button{font-size:12px;min-height:32px}
.color-controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:11px}
.color-controls label{color:var(--muted)}
.color-controls input{width:29px;height:24px;padding:2px;border:1px solid #d4c2b4;border-radius:5px;background:var(--panel);cursor:pointer}
.color-controls .button{font-size:11px;min-height:25px;padding:2px 7px}
.color-controls .button[aria-pressed="true"]{background:var(--soft);color:var(--accent-dark);border-color:#d8b8a8}
.upload{min-height:70px;border:1px dashed #cfbfb0;border-radius:8px;background:#fbf7ef;padding:8px;display:flex;align-items:center;gap:10px}
.upload.dragover{border-color:var(--accent);background:var(--soft)}
.upload-thumb{width:51px;height:51px;object-fit:cover;border-radius:5px;flex:none;background:#e9ddd0}
.upload-placeholder{display:grid;place-items:center;color:var(--accent);font-size:23px}
.upload-detail{min-width:0;flex:1}
.upload-detail b,.upload-detail small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.upload-detail b{font-size:12px}
.upload-detail small{font-size:11px;color:var(--muted);margin-top:4px}
.upload .button{font-size:11px;min-height:29px;padding:4px 8px}
.remove-photo{display:block;border:0;background:transparent;color:var(--muted);font-size:11px;padding:4px 0 0;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.editor-section + .editor-section{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px 11px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font-size:11px;color:#554a40;font-weight:650}
.field input{width:100%;height:32px;border:1px solid #e0d4c8;background:#fffdf8;border-radius:6px;padding:4px 8px;color:var(--ink);min-width:0}
.field input::placeholder{color:#897a6f}
.field input:focus{border-color:var(--accent)}
.stub-fields{grid-template-columns:1fr 1fr .62fr}
.stub-fields label{font:750 11px/1.3 var(--mono);letter-spacing:.06em}
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.genre-slot{display:flex;min-width:0;gap:4px}
.genre-slot input{flex:1}
.genre-slot button{min-width:30px;padding:0}
.genre-title,.runtime-title{display:flex;align-items:center;justify-content:space-between;gap:4px}
.genre-title .button{min-height:24px;padding:2px 6px;font-size:11px}
.field .runtime-option{display:flex;align-items:center;gap:3px;white-space:nowrap}
.field .runtime-option input{width:auto;height:auto;accent-color:var(--accent);margin:0}
.film-reference{font-size:11px;color:var(--muted);padding-top:9px}
.film-reference p{margin:0 0 5px}
.film-reference a{color:var(--accent-dark);margin-right:8px;text-underline-offset:3px}
.stage-action{position:sticky;top:14px;align-self:start;display:grid;place-items:center;width:100%;grid-area:1/1}
@media(max-width:670px){.stage-action{position:static}}
.section-tip{margin:0;color:var(--muted);font-size:11px}
.crop-area{display:grid;gap:5px;margin-top:8px;color:var(--muted);font-size:11px}
.crop-head,.crop-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crop-actions{margin-top:5px}
.crop-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.crop-controls label{display:grid;gap:2px;min-width:0}
.crop-controls input{width:100%;min-width:0;accent-color:var(--accent);margin:0}
.crop-actions button,.crop-head button{padding:0;color:var(--accent);font-size:11px;border:0;background:transparent;text-decoration:underline;text-underline-offset:3px}
.gallery{margin-top:18px}
.gallery .panel-head{min-height:48px}
.gallery-heading{display:flex;align-items:baseline;gap:10px}
.gallery-actions{display:flex;gap:8px}
.gallery .button{min-height:29px;font-size:12px}
.gallery-tiles{display:flex;gap:9px;flex-wrap:wrap;padding:11px 19px 13px;min-height:68px}
.page-tile{display:flex;align-items:center;gap:8px;min-width:108px;max-width:190px;padding:4px 8px 4px 4px;text-align:left;border-radius:7px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);min-height:44px}
.page-tile:hover,.page-tile[aria-current="true"]{border-color:#b95544;background:#f7e9df}
.page-tile img,.tile-empty{width:32px;height:34px;border-radius:4px;object-fit:cover;flex:none;background:#ede1d4}
.tile-empty{display:grid;place-items:center;color:#7c6556;font-size:15px}
.tile-copy{min-width:0}
.tile-copy small{display:block;font:10px/1.35 var(--mono);color:var(--muted);letter-spacing:.04em}
.tile-copy b{font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-status{position:fixed;z-index:5;right:clamp(12px,4vw,56px);bottom:12px;max-width:min(400px,calc(100vw - 24px));margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:0 3px 12px #4525101f;color:var(--ink);font-size:12px}
.app-status.error{color:var(--accent-dark)}
.empty-state{min-height:280px;display:grid;align-content:center;justify-items:center;text-align:center;gap:12px;padding:20px}
.empty-state p{color:var(--muted);margin:0}
.stage .empty-state{width:100%;height:100%}
dialog{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:min(360px,calc(100% - 32px));box-shadow:0 10px 32px #45251032}
dialog::backdrop{background:#2d201a55}
dialog p{color:var(--muted);margin:10px 0 16px;overflow-wrap:anywhere}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:850px){.workspace{grid-template-columns:minmax(0,1fr) minmax(310px,1fr);gap:12px}.panel-head,.editor-body{padding-inline:13px}.gallery{margin-top:12px}.gallery-tiles{padding-inline:13px}.dimension{display:none}}
@media(max-width:670px){main{padding-block:12px}.top-inner{min-height:63px}.brand{gap:8px}.brand-mark{width:31px;height:31px}.brand h1{font-size:14px;letter-spacing:0}.brand p{font-size:8px}.exports{gap:5px}.exports .button{font-size:11px;min-height:31px;padding:5px 7px}.download-icon{display:none}.workspace{grid-template-columns:minmax(0,1fr)}.panel-head,.editor-head{min-height:46px}.stage{min-height:432px}.dimension{display:inline}.ticket-wrap canvas{max-height:424px;width:auto;max-width:100%}.gallery-tiles{gap:6px}.field input{height:36px;font-size:16px}.app-status{text-align:left}}
@media(max-width:550px){.project-bar{flex-wrap:wrap;gap:8px}.project-name{flex-basis:100%}.project-name input{width:100%;font-size:16px}.project-actions .button{min-height:30px}}
@media(max-width:340px){.brand-mark{display:none}.dimension{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i><b></b></i></span><div><h1>电影票根工作室</h1><p>FREYA LOVE FILM</p></div></div>
    <div class="exports" aria-label="导出全部票根">
      <button class="button" id="export-png" type="button" title="导出全部票根为 PNG"><span class="download-icon" aria-hidden="true"></span>导出 PNG</button>
      <button class="button primary" id="export-pdf" type="button" title="导出全部票根为多页 PDF"><span class="download-icon" aria-hidden="true"></span>导出 PDF</button>
    </div>
  </div>
</header>
<main>
  <section class="panel project-bar" aria-label="项目文件">
    <div class="project-name"><label for="project-name">项目名称</label><input id="project-name" type="text" maxlength="80" placeholder="未命名项目" autocomplete="off"></div>
    <div class="project-actions">
      <button class="button" id="new-project" type="button">新建项目</button>
      <button class="button" id="open-project" type="button">打开项目</button>
      <button class="button" id="save-project" type="button"><span class="download-icon" aria-hidden="true"></span>保存项目</button>
      <input id="project-file" type="file" accept=".json,application/json" hidden>
    </div>
  </section>
  <div class="workspace">
    <section class="panel preview-panel" aria-labelledby="preview-label">
      <div class="panel-head">
        <div class="preview-heading"><h2 id="preview-label">票根预览</h2><span class="dimension" id="dimension">70 × 150 mm</span></div>
        <div class="segment" role="group" aria-label="预览方式">
          <button id="trim-view" type="button" aria-pressed="true">成品</button>
          <button id="paper-view" type="button" aria-pressed="false">含白边</button>
        </div>
      </div>
      <div class="stage">
        <div class="stage-action"><div class="ticket-wrap" id="ticket-wrap"><canvas id="preview" aria-label="当前电影票根预览" role="img"></canvas><div class="photo-drag" id="photo-drag" title="拖动剧照调整构图" aria-hidden="true" hidden></div></div></div>
        <div class="empty-state" id="empty-preview" hidden><p>你的票根将在这里预览</p></div>
      </div>
      <div class="stage-footer" id="preview-note">成品 70 × 150 mm · 导出时四周各留 2 mm 白边</div>
    </section>
    <section class="panel editor-panel" aria-labelledby="editor-label">
      <div class="panel-head editor-head"><h2 id="editor-label">编辑票根</h2><span class="counter" id="active-counter"></span></div>
      <div class="editor-body" id="editor">
        <div class="editor-section">
          <div class="section-top"><h3>剧照</h3><div class="color-controls">
            <label for="accent-color">字体颜色</label><input id="accent-color" type="color" value="#a33e2e" title="为片名和底部文字选色"><span class="hex" id="accent-value"></span><button class="button" id="auto-color" type="button" aria-pressed="true">自动取色</button>
          </div></div>
          <div class="upload" id="dropzone">
            <img class="upload-thumb" id="upload-thumb" alt="" hidden>
            <div class="upload-thumb upload-placeholder" id="upload-placeholder" aria-hidden="true">＋</div>
            <div class="upload-detail"><b id="photo-name">上传一张剧照</b><small id="photo-hint">可拖放图片 · 自动裁成正方形</small></div>
            <button class="button" id="choose-image" type="button">上传剧照</button>
            <input id="upload-input" type="file" accept="image/*" hidden>
          </div>
          <div class="crop-area" id="crop-area" hidden>
            <div class="crop-head"><span>可直接拖动预览中的剧照</span><button id="reset-crop" type="button">重置构图</button></div>
            <div class="crop-controls">
              <label for="crop-x">左右位置<input id="crop-x" type="range" min="0" max="100" value="50"></label>
              <label for="crop-y">上下位置<input id="crop-y" type="range" min="0" max="100" value="50"></label>
              <label for="crop-zoom"><span>缩放 <output id="zoom-value" for="crop-zoom">100%</output></span><input id="crop-zoom" aria-label="等比例缩放" type="range" min="100" max="400" value="100"></label>
            </div>
            <div class="crop-actions"><button id="remove-photo" type="button">移除剧照</button></div>
          </div>
        </div>
        <div class="editor-section">
          <div class="section-top"><h3>电影信息</h3></div>
          <div class="fields">
            <div class="field full"><label for="film-title">中文片名</label><input id="film-title" data-field="title" type="text" maxlength="30" placeholder="输入电影名" autocomplete="off"></div>
            <div class="field full"><label for="director">导演</label><input id="director" data-field="director" type="text" maxlength="65" placeholder="导演姓名" autocomplete="off"></div>
            <div class="field full">
              <div class="genre-title"><label for="genre-1">风格 / 类型</label><button class="button" id="add-genre" type="button">＋ 添加类型</button></div>
              <div class="genre-grid" id="genres"></div>
            </div>
            <div class="field"><label for="release">上映或首播日期</label><input id="release" data-field="release" type="text" maxlength="16" placeholder="例如 2026-06-12" autocomplete="off"></div>
            <div class="field"><div class="runtime-title"><label for="runtime">片长（分钟）</label><label class="runtime-option"><input id="episodic" data-field="episodic" type="checkbox">每集</label></div><input id="runtime" data-field="runtime" type="text" maxlength="12" placeholder="例如 99" autocomplete="off"></div>
          </div>
          <div class="film-reference" id="film-reference" hidden><p id="film-note"></p><div id="film-sources"></div></div>
        </div>
        <div class="editor-section">
          <div class="section-top"><h3>观影信息</h3><p class="section-tip">留空可打印后手写</p></div>
          <div class="fields stub-fields">
            <div class="field"><label for="hall">HALL</label><input id="hall" data-field="hall" type="text" maxlength="7" placeholder="影厅" autocomplete="off"></div>
            <div class="field"><label for="date">DATE</label><input id="date" data-field="date" type="text" maxlength="10" placeholder="观影日期" autocomplete="off"></div>
            <div class="field"><label for="companion">WITH</label><input id="companion" data-field="companion" type="text" maxlength="24" placeholder="同行人" autocomplete="off"></div>
            <div class="field full"><label for="wordmark">票根底部文字</label><input id="wordmark" data-field="wordmark" type="text" placeholder="可留空" autocomplete="off"></div>
          </div>
        </div>
      </div>
      <div class="empty-state" id="empty-editor" hidden><p>新建一张票根开始编辑</p><button class="button primary" id="empty-add" type="button">＋ 添加票根</button></div>
    </section>
  </div>
  <section class="panel gallery" aria-labelledby="gallery-label">
    <div class="panel-head">
      <div class="gallery-heading"><h2 id="gallery-label">我的票根</h2><span class="counter" id="page-count"></span></div>
      <div class="gallery-actions"><button class="button" id="delete-page" type="button">删除当前票根</button><button class="button primary" id="add-page" type="button">＋ 添加票根</button></div>
    </div>
    <div class="gallery-tiles" id="page-list" aria-label="选择要编辑的票根"></div>
  </section>
  <p class="app-status" id="status" role="status" aria-live="polite" hidden></p>
</main>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <form method="dialog">
    <h2 id="delete-title">删除票根？</h2>
    <p id="delete-description"></p>
    <div class="dialog-actions"><button type="submit" value="cancel" class="button" autofocus>取消</button><button type="submit" value="delete" class="button primary">删除</button></div>
  </form>
</dialog>
<dialog id="project-dialog" aria-labelledby="project-dialog-title">
  <form method="dialog">
    <h2 id="project-dialog-title">切换项目？</h2>
    <p>当前项目有尚未保存到文件的修改。你可以先保存一份，再切换。</p>
    <div class="dialog-actions"><button type="submit" value="cancel" class="button" autofocus>取消</button><button type="submit" value="proceed" class="button primary">继续切换</button></div>
  </form>
</dialog>
<script>
"use strict";

const PAPER = "#fcf6e8";
const INK = "#25211d";
const DEFAULT_ACCENT = "#a33e2e";
const DEFAULT_WORDMARK = "2026 LOVE FILM";
const METADATA_SEPARATOR = "  /  ";
const TRIM_WIDTH = 70;
const TRIM_HEIGHT = 150;
const MARGIN = 2;
const PAPER_WIDTH = TRIM_WIDTH + 2 * MARGIN;
const PAPER_HEIGHT = TRIM_HEIGHT + 2 * MARGIN;
const DPI = 300;
const PHOTO = { x: 4.5, y: 4.5, size: 61 };
const TEAR_Y = 110;
const NOTCH = 2.65;
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB",sans-serif';
const PHOTO_PLACEHOLDER = "#efe5d6";
const encoder = new TextEncoder();

function ticketShape(ctx) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(TRIM_WIDTH, 0);
  ctx.lineTo(TRIM_WIDTH, TEAR_Y - NOTCH);
  ctx.arc(TRIM_WIDTH, TEAR_Y, NOTCH, -Math.PI / 2, -Math.PI, true);
  ctx.arc(TRIM_WIDTH, TEAR_Y, NOTCH, Math.PI, Math.PI / 2, true);
  ctx.lineTo(TRIM_WIDTH, TRIM_HEIGHT - 4.6);
  ctx.arc(TRIM_WIDTH, TRIM_HEIGHT, 4.6, -Math.PI / 2, -Math.PI, true);
  for (let x = 59.5; x >= 10; x -= 7) {
    ctx.lineTo(x + 2.15, TRIM_HEIGHT);
    ctx.arc(x, TRIM_HEIGHT, 2.15, 0, -Math.PI, true);
  }
  ctx.lineTo(4.6, TRIM_HEIGHT);
  ctx.arc(0, TRIM_HEIGHT, 4.6, 0, -Math.PI / 2, true);
  ctx.lineTo(0, TEAR_Y + NOTCH);
  ctx.arc(0, TEAR_Y, NOTCH, Math.PI / 2, -Math.PI / 2, true);
  ctx.closePath();
}

function cropBounds(image, zoom) {
  const size = Math.min(image.naturalWidth, image.naturalHeight) / zoom;
  return { size, travelX: image.naturalWidth - size, travelY: image.naturalHeight - size };
}

function croppedSquare(image, crop) {
  const { size, travelX, travelY } = cropBounds(image, crop.zoom);
  return [travelX * crop.x, travelY * crop.y, size, size];
}

function drawPhoto(ctx, image, crop, blankArt) {
  const { x, y, size } = PHOTO;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, size, size, 2.4);
  ctx.clip();
  ctx.fillStyle = PHOTO_PLACEHOLDER;
  ctx.fillRect(x, y, size, size);
  if (image) {
    const [sourceX, sourceY, side] = croppedSquare(image, crop);
    ctx.drawImage(image, sourceX, sourceY, side, side, x, y, size, size);
  } else if (blankArt) {
    ctx.fillStyle = "#796858";
    ctx.font = `450 2.65px ${FONT}`;
    ctx.textAlign = "center";
    ctx.fillText("上传剧照", x + size / 2, y + size / 2);
  }
  ctx.restore();
}

// The display lettering is drawn as outlines so its geometry is identical in every browser and export.
const MARK = {
  "2": [10, "M0 5C0 1.8 2.1 0 5 0C8 0 10 1.8 10 4.5C10 7.6 6.9 9 5.1 10.7H10V14H0V12C0 8.7 6.5 6.1 6.5 4.5C6.5 3.8 5.9 3.3 5 3.3C4.1 3.3 3.6 4 3.6 5Z"],
  "0": [10, "M5 0C8.4 0 10 2.3 10 5.8V8.2C10 11.7 8.4 14 5 14C1.6 14 0 11.7 0 8.2V5.8C0 2.3 1.6 0 5 0ZM5 3.4C3.9 3.4 3.5 4.3 3.5 5.8V8.2C3.5 9.7 3.9 10.6 5 10.6C6.1 10.6 6.5 9.7 6.5 8.2V5.8C6.5 4.3 6.1 3.4 5 3.4Z"],
  "6": [10, "M9 3.4C5.6 3.4 4.4 4.3 3.9 5.6C4.4 5.3 5 5.1 5.8 5.1C8.3 5.1 10 6.8 10 9.4C10 12.2 8.1 14 5.2 14C1.7 14 0 11.6 0 8.5C0 3 2.9 0 9 0ZM5.1 8.1C4.2 8.1 3.6 8.7 3.6 9.5C3.6 10.4 4.2 11 5.1 11C6 11 6.6 10.4 6.6 9.5C6.6 8.7 6 8.1 5.1 8.1Z"],
  L: [9.4, "M0 0H3.9V10.3H9.4V14H0Z"],
  O: [12.3, "M6.1 0C9.6 0 12.3 2.7 12.3 6.2C12.3 9.7 9.6 12.4 6.1 12.4C2.7 12.4 0 9.7 0 6.2C0 2.7 2.7 0 6.1 0ZM6.1 4C4.8 4 3.9 4.9 3.9 6.2C3.9 7.5 4.8 8.4 6.1 8.4C7.4 8.4 8.4 7.5 8.4 6.2C8.4 4.9 7.4 4 6.1 4Z"],
  V: [11, "M0 2.3H3.8L5.7 9.6C6.8 8.3 7.4 5.9 7.4 1.4H11C11 8.8 8.7 12.1 6.8 14H3.4Z"],
  E: [9.8, "M0 6.4C0 2.6 2.5 0 6.1 0H9.8V3.5H6.3C5.1 3.5 4.4 4 4 5H8.6V8.3H3.9V10.5H9.8V14H0Z"],
  F: [9.8, "M0 6.1C0 2.2 2.5 0 6.1 0H9.8V3.6H6.3C4.9 3.6 4 4.4 4 5.9H8.3V9.3H4V14H0Z"],
  I: [4.3, "M2.15 0A2.15 2.15 0 1 1 2.15 4.3A2.15 2.15 0 1 1 2.15 0ZM.25 5.6H4.05V14H.25Z"],
  M: [14, "M0 0H3.8L7 5.1L10.2 0H14V14H10.2V6.4L7 11L3.8 6.4V14H0Z"]
};
for (const glyph of Object.values(MARK)) glyph[1] = new Path2D(glyph[1]);
const MARK_WORDS = DEFAULT_WORDMARK.split(" ");
const LETTER_GAP = 1.05;
const WORD_GAP = 4.9;
const MARK_WIDTH = MARK_WORDS.reduce((total, word) =>
  total + [...word].reduce((sum, letter) => sum + MARK[letter][0], 0)
  + (word.length - 1) * LETTER_GAP, (MARK_WORDS.length - 1) * WORD_GAP);

function drawWordmark(ctx, accent, value) {
  const label = value.trim();
  if (!label) return;
  if (label.replace(/\s+/g, "") !== "2026LOVEFILM") {
    ctx.save();
    ctx.fillStyle = accent;
    ctx.textBaseline = "middle";
    ctx.font = `900 8.4px "Arial Black", ${FONT}`;
    const parts = label.split(/\s+/u);
    if (ctx.measureText(label).width > 83 && parts.length > 1) {
      let split = 1;
      for (let index = 1; index < parts.length; index++) {
        const left = ctx.measureText(parts.slice(0, index).join(" ")).width;
        const right = ctx.measureText(parts.slice(index).join(" ")).width;
        split = index;
        if (left >= right) break;
      }
      ctx.font = `900 4.7px "Arial Black", ${FONT}`;
      ctx.fillText(parts.slice(0, split).join(" "), 4.5, 136.6, 61);
      ctx.fillText(parts.slice(split).join(" "), 4.5, 142, 61);
    } else {
      ctx.fillText(label, 4.5, 139.25, 61);
    }
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(4.5, 134.5);
  ctx.scale(61 / MARK_WIDTH, .67);
  ctx.fillStyle = accent;
  MARK_WORDS.forEach((word, wordIndex) => {
    [...word].forEach((letter, letterIndex) => {
      const [width, outline] = MARK[letter];
      ctx.fill(outline, "evenodd");
      ctx.translate(width + (letterIndex < word.length - 1 ? LETTER_GAP : 0), 0);
    });
    if (wordIndex < MARK_WORDS.length - 1) ctx.translate(WORD_GAP, 0);
  });
  ctx.restore();
}

function rule(ctx, x1, x2, y, color, weight, dash = []) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = weight;
  ctx.setLineDash(dash);
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function wrapTitle(ctx, value) {
  const words = [];
  let line = "";
  for (const char of value) {
    if (!words.length && line && ctx.measureText(line + char).width > 61) {
      words.push(line.trimEnd());
      line = "";
    }
    line += char;
  }
  if (line) words.push(line.trimStart());
  return words;
}

function renderTicket(canvas, ticket, image, { paper, preview = false } = {}) {
  const width = paper ? PAPER_WIDTH : TRIM_WIDTH;
  const height = paper ? PAPER_HEIGHT : TRIM_HEIGHT;
  const density = preview ? 8 : DPI / 25.4;
  canvas.width = Math.round(width * density);
  canvas.height = Math.round(height * density);
  const ctx = canvas.getContext("2d", { willReadFrequently: !preview });
  ctx.scale(canvas.width / width, canvas.height / height);
  ctx.imageSmoothingQuality = "high";
  if (paper) {
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, width, height);
    ctx.translate(MARGIN, MARGIN);
  }

  ctx.save();
  ticketShape(ctx);
  ctx.clip();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, TRIM_WIDTH, TRIM_HEIGHT);
  drawPhoto(ctx, image, ticket.crop, preview);
  ctx.textBaseline = "middle";
  ctx.fillStyle = ticket.accent;
  ctx.font = `780 5.9px ${FONT}`;
  const title = wrapTitle(ctx, ticket.title.trim() || (preview ? "中文片名" : ""));
  title.forEach((line, index) => {
    ctx.fillText(line, 4.5, title.length === 1 ? 75.3 : 72.5 + index * 6.3, 61);
  });

  ctx.font = `450 2.55px ${FONT}`;
  ctx.fillStyle = INK;
  ctx.fillText(ticket.director.trim() ? `导演  ${ticket.director.trim()}` : "", 4.5, 87.7, 61);
  ctx.fillText(cleanGenres(ticket.genres).join(METADATA_SEPARATOR), 4.5, 95, 61);
  const release = ticket.release.trim() ? `${ticket.release.trim()} ${ticket.episodic ? "首播" : "上映"}` : "";
  const runtime = ticket.runtime ? `${ticket.episodic ? "单集" : "片长"}  ${ticket.runtime} 分钟` : "";
  ctx.fillText([release, runtime].filter(Boolean).join(METADATA_SEPARATOR), 4.5, 102.3, 61);
  rule(ctx, 2.5, 67.5, TEAR_Y, INK, .34, [1.15, .95]);

  const stub = [
    { label: "HALL", value: ticket.hall.trim(), x: 4.5, width: 18.5 },
    { label: "DATE", value: ticket.date.trim(), x: 27.5, width: 20 },
    { label: "WITH", value: ticket.companion.trim(), x: 53, width: 12.5 }
  ];
  for (const column of stub) {
    ctx.font = 'bold 2.85px Georgia,"Times New Roman",serif';
    ctx.fillText(column.label, column.x, 117.4);
    if (column.value) {
      ctx.font = `500 2.52px ${FONT}`;
      ctx.fillText(column.value, column.x, 123.9, column.width);
    } else {
      rule(ctx, column.x, column.x + column.width, 125.5, "#ad9e8e", .15);
    }
  }
  rule(ctx, 4.5, 65.5, 130.2, "#958576", .14, [.72, .62]);
  drawWordmark(ctx, ticket.accent, ticket.wordmark);
  ctx.restore();

  if (paper && preview) {
    ctx.save();
    ticketShape(ctx);
    ctx.lineWidth = .12;
    ctx.strokeStyle = "#876f59";
    ctx.setLineDash([.65, .45]);
    ctx.stroke();
    ctx.restore();
  }
}

function colorFromImage(image, crop) {
  const sample = document.createElement("canvas");
  sample.width = sample.height = 44;
  const ctx = sample.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, 44, 44);
  const [x, y, side] = croppedSquare(image, crop);
  ctx.drawImage(image, x, y, side, side, 0, 0, 44, 44);
  const pixels = ctx.getImageData(0, 0, 44, 44).data;
  const hues = Array.from({ length: 12 }, () => ({ weight: 0, red: 0, green: 0, blue: 0 }));
  let graySum = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    const [r, g, b] = [pixels[i], pixels[i + 1], pixels[i + 2]];
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const chroma = max - min;
    graySum += (r + g + b) / 3;
    if (chroma < 20 || max < 43) continue;
    let hue = (r === max) ? (g - b) / chroma : (g === max) ? 2 + (b - r) / chroma : 4 + (r - g) / chroma;
    hue = (hue + 6) % 6;
    const bin = hues[Math.round(hue * 2) % 12];
    const weight = chroma / 255;
    bin.weight += weight;
    bin.red += r * weight;
    bin.green += g * weight;
    bin.blue += b * weight;
  }
  const best = hues.reduce((first, second) => first.weight > second.weight ? first : second);
  const gray = Math.max(54, Math.min(111, graySum / (pixels.length / 4)));
  let rgb = best.weight < 7 ? [gray, gray, gray] :
    [best.red, best.green, best.blue].map(value => value / best.weight);
  const luminance = ([red, green, blue]) =>
    [red, green, blue].map(channel => channel / 255).map(channel => channel <= .04045 ?
      channel / 12.92 : ((channel + .055) / 1.055) ** 2.4)
      .reduce((sum, value, i) => sum + value * [.2126, .7152, .0722][i], 0);
  const paperLight = luminance([252, 246, 232]);
  while ((paperLight + .05) / (luminance(rgb) + .05) < 4.8) {
    rgb = rgb.map(channel => channel * .945);
  }
  return "#" + rgb.map(channel => Math.round(channel).toString(16).padStart(2, "0")).join("");
}

const CRC_TABLE = Uint32Array.from({ length: 256 }, (_, i) => {
  for (let bit = 0; bit < 8; bit++) i = i & 1 ? (i >>> 1) ^ 0xedb88320 : i >>> 1;
  return i >>> 0;
});

function crc32(bytes) {
  let crc = 0xffffffff;
  for (const byte of bytes) crc = CRC_TABLE[(crc ^ byte) & 255] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

function canvasBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("无法生成图片。")), type, quality);
  });
}

async function pngAtPrintDensity(canvas) {
  const png = await canvasBlob(canvas, "image/png");
  const bytes = new Uint8Array(await png.arrayBuffer());
  const pngView = new DataView(bytes.buffer);
  const chunk = new Uint8Array(21);
  const view = new DataView(chunk.buffer);
  view.setUint32(0, 9);
  chunk.set(encoder.encode("pHYs"), 4);
  const pixelsPerMeter = Math.round(DPI / .0254);
  view.setUint32(8, pixelsPerMeter);
  view.setUint32(12, pixelsPerMeter);
  view.setUint8(16, 1);
  view.setUint32(17, crc32(chunk.subarray(4, 17)));

  const parts = [png.slice(0, 33), chunk];
  for (let offset = 33; offset < bytes.length;) {
    const length = pngView.getUint32(offset) + 12;
    const name = String.fromCharCode(...bytes.subarray(offset + 4, offset + 8));
    if (name !== "pHYs") parts.push(png.slice(offset, offset + length));
    offset += length;
  }
  return new Blob(parts, { type: "image/png" });
}

async function zipPngs(entries) {
  if (entries.length > 65535) throw new Error("PNG 压缩包最多可包含 65535 张票根。");
  const parts = [];
  const directory = [];
  let offset = 0;
  let directoryLength = 0;
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const { name, blob } of entries) {
    const data = new Uint8Array(await blob.arrayBuffer());
    const filename = encoder.encode(name);
    const checksum = crc32(data);
    const local = new Uint8Array(30 + filename.length);
    const view = new DataView(local.buffer);
    view.setUint32(0, 0x04034b50, true);
    view.setUint16(4, 20, true);
    view.setUint16(6, 0x800, true);
    view.setUint16(10, time, true);
    view.setUint16(12, date, true);
    view.setUint32(14, checksum, true);
    view.setUint32(18, data.length, true);
    view.setUint32(22, data.length, true);
    view.setUint16(26, filename.length, true);
    local.set(filename, 30);

    const central = new Uint8Array(46 + filename.length);
    const centralView = new DataView(central.buffer);
    centralView.setUint32(0, 0x02014b50, true);
    centralView.setUint16(4, 20, true);
    central.set(local.subarray(4, 30), 6);
    centralView.setUint32(42, offset, true);
    central.set(filename, 46);
    parts.push(local, blob);
    directory.push(central);
    offset += local.length + data.length;
    directoryLength += central.length;
    if (offset + directoryLength >= 0xffffffff) throw new Error("压缩包超过 4 GB，请减少单次导出的票根。");
  }
  const end = new Uint8Array(22);
  const view = new DataView(end.buffer);
  view.setUint32(0, 0x06054b50, true);
  view.setUint16(8, entries.length, true);
  view.setUint16(10, entries.length, true);
  view.setUint32(12, directoryLength, true);
  view.setUint32(16, offset, true);
  return new Blob([...parts, ...directory, end], { type: "application/zip" });
}

const points = mm => (mm * 72 / 25.4).toFixed(6);

async function makePdf(tickets, renderPage, progress) {
  const parts = [];
  const offsets = [0];
  let length = 0;
  const push = part => {
    const bytes = typeof part === "string" ? encoder.encode(part) : part;
    parts.push(bytes);
    length += bytes.byteLength ?? bytes.size;
  };
  function object(id, dictionary, stream) {
    offsets[id] = length;
    push(`${id} 0 obj\n${dictionary}`);
    if (stream) {
      push("\nstream\n");
      push(stream);
      push("\nendstream");
    }
    push("\nendobj\n");
  }

  const pageWidth = points(PAPER_WIDTH);
  const pageHeight = points(PAPER_HEIGHT);
  const media = `[0 0 ${pageWidth} ${pageHeight}]`;
  const trim = `[${points(MARGIN)} ${points(MARGIN)} ${points(PAPER_WIDTH - MARGIN)} ${points(PAPER_HEIGHT - MARGIN)}]`;
  push("%PDF-1.4\n");
  push(Uint8Array.of(37, 226, 227, 207, 211, 10));
  object(1, "<< /Type /Catalog /Pages 2 0 R >>");
  const references = tickets.map((_, index) => `${3 + index * 3} 0 R`).join(" ");
  object(2, `<< /Type /Pages /Count ${tickets.length} /Kids [${references}] >>`);
  const canvas = document.createElement("canvas");
  for (let i = 0; i < tickets.length; i++) {
    await renderPage(canvas, tickets[i]);
    const imagePixels = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
    const rgb = new Uint8Array(canvas.width * canvas.height * 3);
    for (let from = 0, to = 0; from < imagePixels.length; from += 4, to += 3) {
      rgb[to] = imagePixels[from];
      rgb[to + 1] = imagePixels[from + 1];
      rgb[to + 2] = imagePixels[from + 2];
    }
    const compressed = typeof CompressionStream === "function";
    const imageData = compressed
      ? await new Response(new Blob([rgb]).stream().pipeThrough(new CompressionStream("deflate"))).blob()
      : rgb;
    const id = 3 + i * 3;
    const content = encoder.encode(`q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Im0 Do\nQ\n`);
    object(id, `<< /Type /Page /Parent 2 0 R /MediaBox ${media} /BleedBox ${media} /TrimBox ${trim} /Resources << /XObject << /Im0 ${id + 1} 0 R >> >> /Contents ${id + 2} 0 R >>`);
    object(id + 1, `<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 ${compressed ? "/Filter /FlateDecode " : ""}/Length ${imageData.size ?? imageData.length} >>`, imageData);
    object(id + 2, `<< /Length ${content.length} >>`, content);
    progress(i + 1);
  }
  const xref = length;
  push(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);
  push(offsets.slice(1).map(offset => `${String(offset).padStart(10, "0")} 00000 n \n`).join(""));
  push(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}

const PROJECT_FORMAT = "film-ticket-studio";
const PROJECT_VERSION = 1;
const DEFAULT_PROJECT_NAME = "我的电影票根";
const emptyCrop = () => ({ x: .5, y: .5, zoom: 1 });
const clamp = (number, min, max) => Math.max(min, Math.min(max, number));
const stringValue = value => typeof value === "string" ? value : "";
const validHex = value => typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);

function cleanGenres(genres) {
  return [...new Set(genres.flatMap(genre => stringValue(genre).split(/[/／]+/u))
    .map(genre => genre.trim()).filter(Boolean))];
}

function normalizeCrop(crop) {
  const { x, y, zoom } = crop ?? {};
  return {
    x: Number.isFinite(x) ? clamp(x, 0, 1) : .5,
    y: Number.isFinite(y) ? clamp(y, 0, 1) : .5,
    zoom: Number.isFinite(zoom) ? clamp(zoom, 1, 4) : 1
  };
}

function safeSources(sources) {
  if (!Array.isArray(sources)) return [];
  return sources.filter(source => {
    if (!source || typeof source.label !== "string" || typeof source.url !== "string") return false;
    try {
      return new URL(source.url).protocol === "https:";
    } catch {
      return false;
    }
  }).map(({ label, url }) => ({ label, url }));
}

function normalizeTicket(record, { legacy = false } = {}) {
  const position = record.position ?? .5;
  return {
    id: stringValue(record.id) || crypto.randomUUID(),
    title: stringValue(record.title),
    director: stringValue(record.director),
    genres: cleanGenres(Array.isArray(record.genres) ? record.genres : [record.genre]),
    release: stringValue(record.release),
    runtime: stringValue(record.runtime),
    episodic: record.episodic === true,
    hall: stringValue(record.hall),
    date: stringValue(record.date),
    companion: typeof record.companion === "string" ? record.companion : legacy ? "FREYA" : "",
    wordmark: typeof record.wordmark === "string" ? record.wordmark : DEFAULT_WORDMARK,
    photo: record.photo instanceof Blob ? record.photo : null,
    photoName: stringValue(record.photoName),
    crop: normalizeCrop(record.crop ?? { x: position, y: position, zoom: 1 }),
    colorMode: record.colorMode === "manual" ? "manual" : "auto",
    accent: validHex(record.accent) ? record.accent.toLowerCase() : DEFAULT_ACCENT,
    note: stringValue(record.note),
    sources: safeSources(record.sources)
  };
}

function imageAsDataUrl(blob) {
  if (!blob) return null;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("无法读取项目中的剧照。"));
    reader.readAsDataURL(blob);
  });
}

async function imageFromDataUrl(value) {
  if (value == null) return null;
  const match = typeof value === "string" && /^data:(image\/(?:jpeg|png|webp));base64,([\s\S]+)$/u.exec(value);
  if (!match) throw new Error("项目中包含无效的剧照。");
  let bytes;
  try {
    bytes = Uint8Array.from(atob(match[2]), character => character.charCodeAt(0));
  } catch {
    throw new Error("项目中包含损坏的剧照。");
  }
  const blob = new Blob([bytes], { type: match[1] });
  const url = URL.createObjectURL(blob);
  try {
    await decodeImage(url);
  } finally {
    URL.revokeObjectURL(url);
  }
  return blob;
}

async function parseProject(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch {
    throw new Error("无法读取项目文件，请打开从票根工作室保存的 JSON。");
  }
  if (data?.format !== PROJECT_FORMAT || data.version !== PROJECT_VERSION || !Array.isArray(data.tickets)) {
    throw new Error("该文件不是当前版本的票根项目。");
  }
  const collection = [];
  const ids = new Set();
  for (const record of data.tickets) {
    if (!record || typeof record !== "object" || Array.isArray(record)) {
      throw new Error("项目中有无法读取的票根。");
    }
    const ticket = normalizeTicket({ ...record, photo: await imageFromDataUrl(record.photo) });
    if (ids.has(ticket.id)) ticket.id = crypto.randomUUID();
    ids.add(ticket.id);
    collection.push(ticket);
  }
  return {
    name: stringValue(data.name).trim() || DEFAULT_PROJECT_NAME,
    selectedId: ids.has(data.selectedId) ? data.selectedId : collection[0]?.id ?? null,
    tickets: collection
  };
}

async function projectBlob({ name, tickets, selectedId }) {
  const records = [];
  for (const ticket of tickets) {
    records.push({ ...ticket, genres: cleanGenres(ticket.genres), photo: await imageAsDataUrl(ticket.photo) });
  }
  return new Blob([JSON.stringify({ format: PROJECT_FORMAT, version: PROJECT_VERSION, name, selectedId, tickets: records }, null, 2)], {
    type: "application/json"
  });
}

const $ = id => document.getElementById(id);

const preview = $("preview");
const photoDrag = $("photo-drag");
const photoAssets = new Map();
const pendingUploads = new Map();
const DB_NAME = "freya-film-ticket-studio";

let tickets = [];
let selectedId = null;
let includeMargin = false;
let isReady = false;
let isExporting = false;
let deletingId = null;

let projectRevision = 0;
let savedRevision = 0;
let projectBusy = false;
let pendingProjectSwitch;

const activeTicket = () => tickets.find(ticket => ticket.id === selectedId);

function newTicket() {
  return normalizeTicket({});
}

function status(message, { error = false, sticky = false } = {}) {
  clearTimeout(statusTimer);
  const element = $("status");
  element.textContent = message;
  element.hidden = !message;
  element.classList.toggle("error", error);
  if (!sticky) statusTimer = setTimeout(() => { element.hidden = true; }, 4800);
}

function decodeImage(source) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("无法打开这张图片，请换一张 JPG、PNG 或 WebP。"));
    image.src = source;
  });
}

function assetFor(photo) {
  if (!photo) return null;
  if (!photoAssets.has(photo)) {
    const url = URL.createObjectURL(photo);
    const asset = { url, image: null, promise: null };
    asset.promise = decodeImage(url).then(image => {
      asset.image = image;
      return image;
    });
    // A cached decode may fail before a user action awaits it.
    asset.promise.catch(() => {});
    photoAssets.set(photo, asset);
  }
  return photoAssets.get(photo);
}

function prunePhotoAssets() {
  if (isExporting || pendingUploads.size) return;
  const photos = new Set(tickets.map(ticket => ticket.photo));
  for (const [photo, asset] of photoAssets) {
    if (!photos.has(photo)) {
      URL.revokeObjectURL(asset.url);
      photoAssets.delete(photo);
    }
  }
}

function openStorage() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => request.result.createObjectStore("studio");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("浏览器暂时无法打开草稿库。"));
  });
}

function readStudio(db) {
  return new Promise((resolve, reject) => {
    const request = db.transaction("studio", "readonly").objectStore("studio").get("collection");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function saveNow() {
  if (!database) return;
  clearTimeout(saveTimer);
  try {
    const transaction = database.transaction("studio", "readwrite");
    transaction.objectStore("studio").put({ tickets, selectedId, projectName, dirty: projectRevision !== savedRevision }, "collection");
    transaction.onerror = () => status("浏览器未能保存草稿，请用「保存项目」下载文件。", { error: true, sticky: true });
  } catch {
    status("浏览器未能保存草稿，请用「保存项目」下载文件。", { error: true, sticky: true });
  }
}

function scheduleSave() {
  projectRevision++;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 150);
}

function photoInterface(ticket, image) {
  const hasPhoto = Boolean(ticket.photo);
  const asset = assetFor(ticket.photo);
  const thumb = $("upload-thumb");
  if (asset && thumb.getAttribute("src") !== asset.url) thumb.src = asset.url;
  if (!asset) thumb.removeAttribute("src");
  thumb.hidden = !hasPhoto;
  $("upload-placeholder").hidden = hasPhoto;
  $("photo-name").textContent = hasPhoto ? ticket.photoName : "上传一张剧照";
  $("photo-hint").textContent = hasPhoto && image
    ? `${image.naturalWidth} × ${image.naturalHeight} px · 正方形裁切`
    : "可拖放图片 · 自动裁成正方形";
  $("choose-image").textContent = hasPhoto ? "更换剧照" : "上传剧照";
  $("crop-area").hidden = !image;
  updateCropControls(ticket, image);
}

function updateCropControls(ticket, image) {
  const { crop } = ticket;
  const bounds = image ? cropBounds(image, crop.zoom) : { travelX: 0, travelY: 0 };
  const horizontal = bounds.travelX > .001;
  const vertical = bounds.travelY > .001;
  photoDrag.hidden = !horizontal && !vertical;
  $("crop-x").disabled = !horizontal;
  $("crop-y").disabled = !vertical;
  $("crop-x").value = Math.round(crop.x * 100);
  $("crop-y").value = Math.round(crop.y * 100);
  const zoom = Math.round(crop.zoom * 100);
  $("crop-zoom").value = zoom;
  $("zoom-value").value = `${zoom}%`;
}

function positionPhotoTarget() {
  const width = includeMargin ? PAPER_WIDTH : TRIM_WIDTH;
  const height = includeMargin ? PAPER_HEIGHT : TRIM_HEIGHT;
  const margin = includeMargin ? MARGIN : 0;
  Object.assign(photoDrag.style, {
    left: `${(PHOTO.x + margin) / width * 100}%`,
    top: `${(PHOTO.y + margin) / height * 100}%`,
    width: `${PHOTO.size / width * 100}%`,
    height: `${PHOTO.size / height * 100}%`
  });
}

function drawPreview() {
  const ticket = activeTicket();
  if (!ticket) return;
  const asset = assetFor(ticket.photo);
  const image = asset?.image;
  renderTicket(preview, ticket, image, { paper: includeMargin, preview: true });

  $("auto-color").setAttribute("aria-pressed", String(ticket.colorMode === "auto"));
  $("accent-value").textContent = ticket.accent.toUpperCase();
}

function schedulePreview() {
  cancelAnimationFrame(previewFrame);
  previewFrame = requestAnimationFrame(drawPreview);
}

function populateTiles() {

    const button = document.createElement("button");
    button.type = "button";
    button.className = "page-tile";

    const thumb = document.createElement(asset ? "img" : "span");

      thumb.src = asset.url;
      thumb.alt = "";
    } else {
      thumb.className = "tile-empty";
      thumb.textContent = "▤";
      thumb.setAttribute("aria-hidden", "true");
    }

    copy.className = "tile-copy";

    const label = document.createElement("b");

function updateControls() {
  for (const id of ["export-png", "export-pdf"]) $(id).disabled = !isReady || !tickets.length || isExporting;
  $("add-page").disabled = !isReady;
  $("empty-add").disabled = !isReady;
  $("delete-page").disabled = !isReady || !activeTicket();
  for (const id of ["new-project", "open-project", "save-project"]) {
    $(id).disabled = !isReady || projectBusy || isExporting;
  }
}

function refresh() {
  const ticket = activeTicket();
  const present = Boolean(ticket);
  $("ticket-wrap").hidden = !present;
  $("empty-preview").hidden = present;
  $("editor").hidden = !present;
  $("empty-editor").hidden = present;
  $("active-counter").textContent = present
    ? `${String(tickets.indexOf(ticket) + 1).padStart(2, "0")} / ${String(tickets.length).padStart(2, "0")}` : "";
  populateTiles();
  updateControls();
  if (!ticket) return;
  for (const input of fieldInputs) {
    const value = ticket[input.dataset.field];
    if (input.type === "checkbox") input.checked = value;
    else input.value = value;
  }
  renderGenreFields(ticket);
  renderReferences(ticket);
  const asset = assetFor(ticket.photo);
  photoInterface(ticket, asset?.image);
  drawPreview();
  if (asset && !asset.image) {
    const photo = ticket.photo;
    asset.promise.then(image => {
      if (activeTicket()?.photo === photo) {
        photoInterface(activeTicket(), image);
        schedulePreview();
      }
    }).catch(error => {
      if (activeTicket()?.photo === photo) status(error.message, { error: true });
    });
  }
}

function addTicket() {
  if (!isReady) return;
  const ticket = newTicket();
  tickets.push(ticket);
  selectedId = ticket.id;

  projectRevision++;
  saveNow();
  $("film-title").focus();
}

function deleteSelected() {
  const ticket = activeTicket();
  if (!ticket) return;
  const dialog = $("delete-dialog");
  deletingId = ticket.id;
  dialog.returnValue = "cancel";
  $("delete-description").textContent = `将从当前批次移除「${ticket.title.trim() || "未命名票根"}」。`;
  dialog.showModal();
}

$("delete-dialog").addEventListener("close", () => {
  if ($("delete-dialog").returnValue !== "delete") return;
  const index = tickets.findIndex(ticket => ticket.id === deletingId);
  if (index < 0) return;
  const [ticket] = tickets.splice(index, 1);
  pendingUploads.delete(ticket.id);
  if (selectedId === ticket.id) selectedId = tickets[Math.min(index, tickets.length - 1)]?.id ?? null;
  refresh();
  prunePhotoAssets();
  projectRevision++;
  saveNow();
  status("已删除票根");
});

async function storePhoto(file) {
  const source = URL.createObjectURL(file);
  try {
    const image = await decodeImage(source);
    const scale = Math.min(1, 2400 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = PHOTO_PLACEHOLDER;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    return await canvasBlob(canvas, "image/jpeg", .94);
  } finally {
    URL.revokeObjectURL(source);
  }
}

async function importPhoto(file) {
  const ticket = activeTicket();
  if (!ticket || !file) return;
  const token = Symbol();
  pendingUploads.set(ticket.id, token);
  const stillCurrent = () => pendingUploads.get(ticket.id) === token;
  status("正在读取剧照…", { sticky: true });
  try {
    const photo = await storePhoto(file);
    if (!stillCurrent()) return;
    const image = await assetFor(photo).promise;
    if (!stillCurrent()) return;
    ticket.photo = photo;
    ticket.photoName = file.name;
    ticket.crop = emptyCrop();
    if (ticket.colorMode === "auto") ticket.accent = colorFromImage(image, ticket.crop);
    projectRevision++;
    if (selectedId === ticket.id) refresh();
    else populateTiles();
    saveNow();
    status("已更新剧照和主题色");
  } catch (error) {
    if (stillCurrent()) status(error.message, { error: true });
  } finally {
    if (stillCurrent()) pendingUploads.delete(ticket.id);
    prunePhotoAssets();
  }
}

function setCrop(ticket, image, crop) {

$("reset-crop").addEventListener("click", () => {

photoDrag.addEventListener("pointerdown", event => {
  if (event.button !== 0 || cropDrag) return;
  const ticket = activeTicket();
  const image = assetFor(ticket?.photo)?.image;
  if (!image) return;
  const { size, travelX, travelY } = cropBounds(image, ticket.crop.zoom);
  cropDrag = {
    ticket, image, pointer: event.pointerId, initial: { ...ticket.crop },
    startX: event.clientX, startY: event.clientY, travelX, travelY,
    sourcePixelsPerScreenPixel: size / photoDrag.getBoundingClientRect().width
  };
  photoDrag.setPointerCapture(event.pointerId);
  photoDrag.classList.add("dragging");
});
photoDrag.addEventListener("pointermove", event => {
  if (!cropDrag || cropDrag.pointer !== event.pointerId || cropDrag.ticket !== activeTicket()) return;
  const { ticket, image, initial, startX, startY, travelX, travelY, sourcePixelsPerScreenPixel } = cropDrag;
  const x = travelX ? initial.x - (event.clientX - startX) * sourcePixelsPerScreenPixel / travelX : initial.x;
  const y = travelY ? initial.y - (event.clientY - startY) * sourcePixelsPerScreenPixel / travelY : initial.y;
  setCrop(ticket, image, { x, y, zoom: initial.zoom });
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
  photoDrag.addEventListener(type, event => {
    if (cropDrag?.pointer !== event.pointerId) return;
    cropDrag = null;
    photoDrag.classList.remove("dragging");
  });
}

$("accent-color").addEventListener("input", event => {

function renderGenreFields(ticket) {
  const slots = ticket.genres.length ? ticket.genres : [""];
  const genreInputs = slots.map((genre, index) => {
    const row = document.createElement("div");
    row.className = "genre-slot";
    const input = document.createElement("input");
    input.id = `genre-${index + 1}`;
    input.value = genre;
    input.type = "text";
    input.placeholder = index === 0 ? "例如 剧情" : "另一种类型";
    input.setAttribute("aria-label", `风格或类型 ${index + 1}`);
    input.addEventListener("input", () => {
      if (!ticket.genres.length) ticket.genres.push("");
      ticket.genres[index] = input.value;
      schedulePreview();
      scheduleSave();
    });
    row.append(input);
    if (slots.length > 1) {
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", `移除类型 ${index + 1}`);
      remove.addEventListener("click", () => {
        ticket.genres.splice(index, 1);
        renderGenreFields(ticket);
        $(`genre-${Math.min(index + 1, ticket.genres.length || 1)}`).focus();
        schedulePreview();
        scheduleSave();
      });
      row.append(remove);
    }
    return row;
  });
  $("genres").replaceChildren(...genreInputs);
}

function renderReferences(ticket) {

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function filename(ticket, index) {
  const name = ticket.title.trim().replace(/[<>:"/\\|?*\x00-\x1f]/g, "-").replace(/\.+$/, "");
  return `${String(index + 1).padStart(2, "0")}-${name || "未命名票根"}.png`;
}

async function exportTickets(format) {
  if (!isReady || isExporting || !tickets.length) return;
  isExporting = true;
  updateControls();
  const batch = tickets.map(ticket => ({ ...ticket }));
  const progress = count => status(`正在导出 ${count} / ${batch.length} 张…`, { sticky: true });
  const renderPage = async (canvas, ticket) => {
    const image = await assetFor(ticket.photo)?.promise;
    renderTicket(canvas, ticket, image, { paper: true });
  };
  progress(0);
  try {
    if (format === "pdf") {
      const pdf = await makePdf(batch, renderPage, progress);
      download(pdf, "2026-LOVE-FILM-票根.pdf");
    } else {
      const canvas = document.createElement("canvas");
      const entries = [];
      for (let i = 0; i < batch.length; i++) {
        await renderPage(canvas, batch[i]);
        entries.push({ name: filename(batch[i], i), blob: await pngAtPrintDensity(canvas) });
        progress(i + 1);
      }
      if (entries.length === 1) download(entries[0].blob, entries[0].name);
      else download(await zipPngs(entries), "2026-LOVE-FILM-PNG.zip");
    }
    status(`已导出 ${batch.length} 张票根`);
  } catch (error) {
    console.error(error);
    status(`导出失败。 ${error.message}`, { error: true, sticky: true });
  } finally {
    isExporting = false;
    prunePhotoAssets();
    updateControls();
  }
}

$("export-pdf").addEventListener("click", () => void exportTickets("pdf"));

async function initialize() {
  updateControls();
  positionPhotoTarget();
  let saved;

    }
  }
  isReady = true;
  $("project-name").value = projectName;
  refresh();
  if (!saved) saveNow();
  if (storageError) status("当前浏览器无法保存草稿，请在关闭页面前保存项目。", { error: true, sticky: true });
}

$("project-name").addEventListener("input", event => {
  projectName = event.target.value;
  scheduleSave();
});

function openCollection(next) {
  pendingUploads.clear();
  tickets = next.tickets;
  selectedId = next.selectedId;
  projectName = next.name;
  projectRevision++;
  savedRevision = projectRevision;
  $("project-name").value = projectName;
  refresh();
  prunePhotoAssets();
  saveNow();
  status(`已打开「${projectName}」，共 ${tickets.length} 张票根`);
}

function switchProject(next) {
  if (projectRevision === savedRevision) {
    openCollection(next);
    return;
  }
  pendingProjectSwitch = next;
  const dialog = $("project-dialog");
  dialog.returnValue = "cancel";
  dialog.showModal();
}

$("project-dialog").addEventListener("close", () => {
  const next = pendingProjectSwitch;
  pendingProjectSwitch = null;
  if (next && $("project-dialog").returnValue === "proceed") openCollection(next);
});

$("new-project").addEventListener("click", () => {
  const ticket = newTicket();
  switchProject({ name: DEFAULT_PROJECT_NAME, selectedId: ticket.id, tickets: [ticket] });
});
$("open-project").addEventListener("click", () => $("project-file").click());
$("project-file").addEventListener("change", async event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file || projectBusy) return;
  projectBusy = true;
  updateControls();
  status("正在打开项目…", { sticky: true });
  try {
    const next = await parseProject(file);
    status("");
    switchProject(next);
  } catch (error) {
    status(error.message, { error: true });
  } finally {
    projectBusy = false;
    updateControls();
  }
});
$("save-project").addEventListener("click", async () => {
  projectBusy = true;
  updateControls();
  const name = projectName.trim() || DEFAULT_PROJECT_NAME;
  const revision = projectRevision;
  const batch = tickets.map(ticket => ({ ...ticket, genres: [...ticket.genres] }));
  status("正在打包项目…", { sticky: true });
  try {
    const blob = await projectBlob({ name, tickets: batch, selectedId });
    const safeName = name.replace(/[<>:"/\\|?*\x00-\x1f]/g, "-").replace(/\.+$/, "");
    download(blob, `${safeName || DEFAULT_PROJECT_NAME}.film-project.json`);
    savedRevision = revision;
    saveNow();
    status("已下载项目文件");
  } catch (error) {
    status(error.message, { error: true });
  } finally {
    projectBusy = false;
    updateControls();
  }
});

void initialize();

</script>
